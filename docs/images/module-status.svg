<text x="48" y="875.0" font-size="10.8" font-weight="400" text-anchor="start" fill="#57606a">所以上面没有进度百分比，只有「这一条有没有可复现的证据」。缺件阻塞的行不会因为代码写完了就变绿 —— 它要等硬件、等标定、等实测数值。</text>
