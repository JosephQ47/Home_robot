<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" role="img">
<defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#1a73e8"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c5221f"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#00897b"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#e8710a"/></marker>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#57606a"/></marker>
</defs>
<rect width="1240" height="560" rx="10" fill="#ffffff"/>
<text x="32" y="44" font-size="23" font-weight="700" fill="#1f2328">自动速度安全链 · 一条路，四道闸</text>
<text x="32" y="70" font-size="13.5" fill="#57606a">两个规划器可以「提议」速度，但只有一个节点决定谁的提议生效，再由一个节点行使一票否决，最后由不信任任何上位机的 MCU 执行</text>
<rect x="32" y="112" width="230" height="92" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="1.8"/>
<text x="147.0" y="142.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1a73e8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Nav2</text>
<text x="147.0" y="164.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">导航 · 巡检 · 跟随</text>
<text x="147.0" y="180.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">→ /cmd_vel_nav</text>
<rect x="32" y="224" width="230" height="92" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="1.8"/>
<text x="147.0" y="254.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1a73e8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">OpenNav Docking</text>
<text x="147.0" y="276.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">AprilTag 低速精对接</text>
<text x="147.0" y="292.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">→ /cmd_vel_dock</text>
<rect x="330" y="146" width="250" height="148" rx="10" fill="#e3eefc" stroke="#1a73e8" stroke-width="2.6"/>
<text x="455.0" y="176.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1a73e8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">hr_motion_mux</text>
<text x="455.0" y="198.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">按 MotionPhase 互斥选择</text>
<text x="455.0" y="214.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">切换先归零 300 ms</text>
<text x="455.0" y="230.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">源过期即归零</text>
<text x="455.0" y="246.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a"></text>
<text x="455.0" y="262.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">唯一输出 /cmd_vel_auto</text>
<rect x="544" y="154" width="30" height="16" rx="8" fill="#1a7f37"/>
<text x="559" y="166.0" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">NEW</text>
<rect x="648" y="146" width="250" height="148" rx="10" fill="#fce8e6" stroke="#c5221f" stroke-width="2.6"/>
<text x="773.0" y="176.0" font-size="14" font-weight="700" text-anchor="middle" fill="#c5221f" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">Collision Monitor</text>
<text x="773.0" y="198.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">基于最新 /scan 的停止区</text>
<text x="773.0" y="214.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">障碍进入 → 请求零速</text>
<text x="773.0" y="230.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a"></text>
<text x="773.0" y="246.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">唯一输出 /cmd_vel</text>
<rect x="966" y="146" width="242" height="148" rx="10" fill="#fdeddc" stroke="#e8710a" stroke-width="2.6"/>
<text x="1087.0" y="176.0" font-size="14" font-weight="700" text-anchor="middle" fill="#e8710a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">STM32F407</text>
<text x="1087.0" y="198.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">命令超时 150 ms 归零</text>
<text x="1087.0" y="214.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">SBUS 接管优先于自动</text>
<text x="1087.0" y="230.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">限速 / 斜坡 / 限流</text>
<text x="1087.0" y="246.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a"></text>
<text x="1087.0" y="262.0" font-size="11.2" font-weight="400" text-anchor="middle" fill="#57606a">物理执行的唯一权威</text>
<path d="M 262 158 H 300 V 208 H 330" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#a0)"/>
<path d="M 262 270 H 300 V 224 H 330" stroke="#1a73e8" stroke-width="3" fill="none" marker-end="url(#a0)"/>
<path d="M 580 220 H 648" stroke="#c5221f" stroke-width="3.4" fill="none" marker-end="url(#a1)"/>
<path d="M 898 220 H 966" stroke="#c5221f" stroke-width="3.4" fill="none" marker-end="url(#a1)"/>
<text x="614" y="200.0" font-size="11" font-weight="700" text-anchor="middle" fill="#7a1512" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">/cmd_vel_auto</text>
<text x="932" y="200.0" font-size="11" font-weight="700" text-anchor="middle" fill="#7a1512" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">/cmd_vel</text>
<text x="932" y="254.0" font-size="10" font-weight="400" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">经 hr_bridge</text>
<rect x="32" y="396" width="250" height="56" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="157" y="418.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#57606a">两个规划器都可以发速度，</text>
<text x="157" y="433.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#57606a">但都不能直接发 /cmd_vel</text>
<rect x="330" y="396" width="250" height="56" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="455" y="418.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#57606a">任务管理器停发阶段授权，</text>
<text x="455" y="433.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#57606a">这里 1 秒内归零</text>
<rect x="648" y="396" width="250" height="56" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="773" y="418.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#57606a">/scan 过期或本节点异常退出，</text>
<text x="773" y="433.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#57606a">自动任务在冻结时限内取消</text>
<rect x="966" y="396" width="250" height="56" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="1091" y="418.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#57606a">上位机整体失联，</text>
<text x="1091" y="433.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#57606a">150 ms 后底盘自行停车</text>
<path d="M 157 316 V 396" stroke="#57606a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#a4)"/>
<path d="M 455 294 V 396" stroke="#57606a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#a4)"/>
<path d="M 773 294 V 396" stroke="#57606a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#a4)"/>
<path d="M 1091 294 V 396" stroke="#57606a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#a4)"/>
<rect x="32" y="484" width="1176" height="44" rx="8" fill="#fff8e5" stroke="#d4a72c" stroke-width="1.2"/>
<text x="48" y="502.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2328">每一道闸都是「fail closed」</text>
<text x="48" y="519.0" font-size="11" font-weight="400" text-anchor="start" fill="#57606a">坏掉的结果永远是停车，不是继续按最后一个命令跑。回充速度同样走这条链——为了对接成功而关小停止区，属于禁止项，只能回去改充电桩机械设计。</text>
</svg>