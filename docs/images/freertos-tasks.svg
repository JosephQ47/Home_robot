<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" role="img">
<defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#e8710a"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#c5221f"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#5f6368"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#57606a"/></marker>
</defs>
<rect width="1240" height="700" rx="10" fill="#ffffff"/>
<text x="32" y="44" font-size="23" font-weight="700" fill="#1f2328">下位机 FreeRTOS · 四任务与隔离边界</text>
<text x="32" y="70" font-size="13.5" fill="#57606a">任务之间只交换「最新值快照」，不排队、不互等；任何一个任务卡住都不能拖垮 1 ms 控制节拍</text>
<rect x="32" y="96" width="372" height="150" rx="10" fill="#ffffff" stroke="#e8710a" stroke-width="2.2"/>
<text x="218.0" y="124.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#e8710a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">command_task</text>
<rect x="326" y="108" width="66" height="19" rx="9.5" fill="#e8710a" opacity="0.14"/>
<text x="359" y="121.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#e8710a">100 Hz</text>
<text x="48" y="148.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">输入</text>
<text x="388" y="148.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">CmdFrame · SBUS · SafetyPermit</text>
<text x="48" y="166.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">输出</text>
<text x="388" y="166.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">CommandState_t 最新快照</text>
<text x="48" y="184.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">上位机超时</text>
<text x="388" y="184.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">150 ms → 目标归零</text>
<text x="48" y="202.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">SBUS 超时</text>
<text x="388" y="202.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">50 ms → 目标归零</text>
<text x="48" y="220.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">铁律</text>
<text x="388" y="220.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">旧 source_seq 不得恢复运动</text>
<rect x="436" y="96" width="372" height="150" rx="10" fill="#ffffff" stroke="#e8710a" stroke-width="2.2"/>
<text x="622.0" y="124.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#e8710a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">chassis_task</text>
<rect x="730" y="108" width="66" height="19" rx="9.5" fill="#e8710a" opacity="0.14"/>
<text x="763" y="121.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#e8710a">1 kHz</text>
<text x="452" y="148.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">安全/PWM 节拍</text>
<text x="792" y="148.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">1 ms</text>
<text x="452" y="166.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">测速/PI 子周期</text>
<text x="792" y="166.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">10 ms</text>
<text x="452" y="184.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">速度 PI</text>
<text x="792" y="184.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">Kp=0.40 · Ki=0.80 s⁻¹</text>
<text x="452" y="202.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">换向</text>
<text x="792" y="202.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">零 PWM → &lt;10 rpm → 等 50 ms</text>
<text x="452" y="220.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">输出</text>
<text x="792" y="220.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">4×PWM/方向/使能 + WheelOdom</text>
<rect x="840" y="96" width="368" height="150" rx="10" fill="#ffffff" stroke="#e8710a" stroke-width="2.2"/>
<text x="1024.0" y="124.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#e8710a" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">imu_task</text>
<rect x="1130" y="108" width="66" height="19" rx="9.5" fill="#e8710a" opacity="0.14"/>
<text x="1163" y="121.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#e8710a">1 kHz</text>
<text x="856" y="148.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">BMI088</text>
<text x="1192" y="148.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">SPI + DMA，1 kHz</text>
<text x="856" y="166.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">IST8310</text>
<text x="1192" y="166.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">I2C，100 Hz</text>
<text x="856" y="184.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">姿态</text>
<text x="1192" y="184.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">Mahony，四元数归一化</text>
<text x="856" y="202.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">磁场异常</text>
<text x="1192" y="202.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">降级 6 轴，置 mag_degraded</text>
<text x="856" y="220.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">输出</text>
<text x="1192" y="220.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">ImuSample_t（不出欧拉航向）</text>
<rect x="436" y="286" width="372" height="168" rx="10" fill="#fce8e6" stroke="#c5221f" stroke-width="2.2"/>
<text x="622.0" y="314.0" font-size="14.5" font-weight="700" text-anchor="middle" fill="#c5221f" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">monitor_task</text>
<rect x="730" y="298" width="66" height="19" rx="9.5" fill="#c5221f" opacity="0.14"/>
<text x="763" y="311.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c5221f">1 kHz</text>
<text x="452" y="338.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">输入</text>
<text x="792" y="338.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">急停 · 故障 · 心跳 · 电池快照</text>
<text x="452" y="356.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">输出</text>
<text x="792" y="356.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">SafetyPermit · BatteryLevel</text>
<text x="452" y="374.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a"></text>
<text x="792" y="374.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">FaultCode · IWDG 喂狗许可</text>
<text x="452" y="392.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">电量分级</text>
<text x="792" y="392.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">LOW / DOCK_RESERVE / CRITICAL</text>
<text x="452" y="410.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a"></text>
<text x="792" y="410.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">INVALID / CHARGING</text>
<text x="452" y="428.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">过流切断</text>
<text x="792" y="428.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">8 A / 5 ms</text>
<text x="452" y="446.0" font-size="10.5" font-weight="700" text-anchor="start" fill="#57606a">堵转判据</text>
<text x="792" y="446.0" font-size="10.5" font-weight="400" text-anchor="end" fill="#1f2328">6 A + &lt;10 rpm + PWM≥40% + 300 ms</text>
<path d="M 404 171 H 436" stroke="#e8710a" stroke-width="2.6" fill="none" marker-end="url(#a0)"/>
<path d="M 808 171 H 840" stroke="#5f6368" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#a2)"/>
<path d="M 520 286 V 246" stroke="#c5221f" stroke-width="2.8" fill="none" marker-end="url(#a1)"/>
<path d="M 470 286 V 266 H 218 V 246" stroke="#c5221f" stroke-width="2.8" fill="none" marker-end="url(#a1)"/>
<path d="M 780 286 V 266 H 1024 V 246" stroke="#5f6368" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#a2)"/>
<text x="620" y="278.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#7a1512">SafetyPermit（否决权，被监控方无权拒绝）</text>
<rect x="32" y="286" width="372" height="168" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="48" y="310.0" font-size="12" font-weight="700" text-anchor="start" fill="#1f2328">任务间数据交换机制</text>
<text x="48" y="334.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">· 只传「最新值」，不排队：旧命令永远不补执行</text>
<text x="48" y="351.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">· 快照用序列锁：读前后 lock_seq 相等且为偶数才可用</text>
<text x="48" y="368.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">· 连续 3 次读取失败 → 按数据不可用处理</text>
<text x="48" y="385.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">· 每条数据自带时间戳与 valid 标志</text>
<text x="48" y="402.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">· 新鲜度判据：等于阈值可用，超阈值 1 ms 即失效</text>
<text x="48" y="419.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">· 32 位单调时钟回绕必须判定正确</text>
<text x="48" y="436.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">· ISR 只做采集、清标志和通知，不做运算</text>
<rect x="840" y="286" width="368" height="168" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="856" y="310.0" font-size="12" font-weight="700" text-anchor="start" fill="#1f2328">看门狗：软件存活门，不是定时器</text>
<text x="856" y="334.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">monitor_task 只有在确认另外三个任务</text>
<text x="856" y="351.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">都在规定期限内「报到」之后，才去喂 IWDG。</text>
<text x="856" y="368.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a"></text>
<text x="856" y="385.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">所以任何一个被监控任务挂死，IWDG 会超时复位，</text>
<text x="856" y="402.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">而不是让机器人带着一个死任务继续跑。</text>
<text x="856" y="419.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a"></text>
<text x="856" y="436.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">monitor_task 自己挂死同样触发复位，</text>
<text x="856" y="453.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">复位原因记入 reset_cause 并随状态帧上报。</text>
<rect x="32" y="486" width="1176" height="78" rx="8" fill="#fff8e5" stroke="#d4a72c" stroke-width="1.2"/>
<text x="48" y="510.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2328">为什么这四个任务不能再拆细</text>
<text x="48" y="530.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">拆得越细，跨任务共享的状态越多，需要保护的临界区也越多——而每一个临界区都是一次潜在的优先级反转和一次新的时序不确定性。</text>
<text x="48" y="546.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">四任务的边界按「谁拥有哪份数据」划分：命令的所有者是 command_task，轮子的所有者是 chassis_task，姿态的所有者是 imu_task，安全裁决的所有者是 monitor_task。</text>
<text x="48" y="562.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">没有第二个任务可以写别人的数据，所以也不需要互斥锁来争抢它。</text>
<rect x="32" y="584" width="1176" height="84" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="48" y="608.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2328">验收怎么做（技术方案 §10.2）</text>
<text x="48" y="628.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">· 分别挂起 command / chassis / imu 三个被监控任务，验证安全输出与 IWDG 复位；</text>
<text x="48" y="644.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">· 单独阻塞 monitor_task、制造关键 ISR 停止和调度死锁，验证同样会复位；</text>
<text x="48" y="660.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#57606a">· 记录四任务平均/最大执行时间、抖动和 deadline miss，连续满负载不得越限。</text>
</svg>