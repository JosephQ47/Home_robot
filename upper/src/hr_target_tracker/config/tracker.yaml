# 顶层键必须等于节点名（hr_target_tracker），否则 ROS 静默忽略整份文件。
# 校验：upper/tools/verify_config_wiring.py
#
# 本文件在 2026-09-07 之前从未被任何 launch 加载 —— 看着权威，改了不生效。
hr_target_tracker:
  ros__parameters:
    # 目标观测的最大有效期。超过即视为丢失，跟随立刻停。
    #
    # ⚠️ 接线前本文件写的是 1.0，而节点 declare_parameter 的默认值是 0.5。
    # 接线会让 1.0 真正生效 —— 等于把一个安全门限放宽一倍，而 1.0 没有任何
    # 依据。故此处取节点原有的 0.5，保证接线不改变行为。
    # 若确有理由用 1.0，请连同实测依据一起改，不要只改数字。
    max_age_sec: 0.5

    # 检测置信度下限。低于此值不参与关联。
    minimum_confidence: 0.5

    # HMMD 只能给人体径向距离，其他类别没有距离来源。
    hmmd_supported_class: person

    # ── 相机—雷达关联 ──────────────────────────────────────────────
    # Gemini 2 与 RPLIDAR S3 同装在前立柱上，相机在雷达正上方 0.12 m，
    # 两者光轴同向、无横向偏置，所以方位角可以直接比对，不需要平移修正。
    camera_to_lidar_xyz: [0.0, 0.0, -0.12]

    # 关联角窗。Gemini 2 彩色水平视场 86°，输出 1920 px，即 0.045°/px；
    # 一个人形检测框中心的定位误差约 ±20 px（1°），S3 的角分辨率 0.36°。
    # 取 5° 覆盖两者误差与目标自身宽度，同时窄到足以在 1 m 处区分并排两人。
    association_window_rad: 0.087

    # 二维扫描聚类门限。相邻点距离超过它就算不同物体；0.08 m 在 2 m 处对应
    # 2.3°，比 S3 的 0.36° 角分辨率宽得多，不会把一个人劈成两簇。
    cluster_threshold_m: 0.08

    # 深度优先。同帧深度有效时直接用它估距，深度失效才回落到 S3 角窗交叉验证。
    prefer_depth_estimate: true
