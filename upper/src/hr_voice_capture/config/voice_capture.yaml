# asr_adapter=text reads /voice/text_in so the voice chain can be driven from a
# terminal on a PC. Switch to vosk once a microphone is selected and a model is
# on disk. An empty wake_word leaves the gate open — bench only.
# See docs/features/hr_voice.md §6.
hr_voice_capture:
  ros__parameters:
    asr_adapter: text
    model_path: ''
    device: ''
    wake_word: ''
    wake_window_sec: 8.0
    poll_rate_hz: 10.0
