# Wake word and speech capture.
#
# asr_adapter selects the backend. 'text' reads /voice/text_in, which drives the
# whole voice chain from a terminal and replays a transcript during acceptance.
# 'vosk' runs offline recognition from a model on disk; it needs the vosk and
# sounddevice packages (scripts/install_deps.sh python).
hr_voice_capture:
  ros__parameters:
    asr_adapter: text
    model_path: ''
    device: ''

    # Two syllables, and not a word that occurs in ordinary conversation.
    wake_word: 小家
    # Long enough to finish a command like "放到桌面" without hurrying, short
    # enough that the window closes before the next conversation starts.
    wake_window_sec: 8.0

    poll_rate_hz: 10.0
