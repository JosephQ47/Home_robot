# 顶层键必须等于 launch 里的节点名，否则 ROS 静默忽略整份文件、不报任何错。
# 本文件曾写成 hr_local_motion（包名），而节点名是 nav2_local_controller_adapter，
# 于是这些值一直没有生效。校验见 upper/tools/verify_config_wiring.py。
nav2_local_controller_adapter:
  ros__parameters:
    output_enabled: false
    max_goal_distance_m: 0.5
    max_goal_duration_sec: 5.0
    max_linear_mps: 0.10
    max_angular_rps: 0.30
    input_timeout_sec: 0.5
    required_downstream_node: collision_monitor
