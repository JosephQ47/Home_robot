# AMCL for the frozen-map navigation mode. Never started alongside slam_toolbox:
# two publishers of map->odom produce a TF tree that looks fine and is wrong.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.25
    update_min_a: 0.20
    resample_interval: 1
    transform_tolerance: 0.2
    laser_model_type: likelihood_field
    # The S3 reaches 40 m, but indoors every return past ~25 m is a corridor
    # end or a window, and including them only widens the likelihood field.
    laser_max_range: 25.0
    laser_min_range: -1.0
    max_beams: 60
    # Odometry noise. Lower than AMCL's 0.2 defaults because this chassis has
    # 1560 count/rev quadrature encoders on all four wheels: rotation and
    # translation are both well observed, and the dominant error is wheel slip
    # rather than counting. alpha5 is zero — a differential drive has no
    # sideways translation to model.
    alpha1: 0.10
    alpha2: 0.10
    alpha3: 0.10
    alpha4: 0.05
    alpha5: 0.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    do_beamskip: false
    set_initial_pose: false
