# AMCL for the frozen-map navigation mode. Never started alongside slam_toolbox:
# two publishers of map->odom produce a TF tree that looks fine and is wrong.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.25
    update_min_a: 0.20
    resample_interval: 1
    transform_tolerance: 0.2
    laser_model_type: likelihood_field
    laser_max_range: 25.0     # RPLIDAR S3; confirm against the measured range
    laser_min_range: -1.0
    max_beams: 60
    # PENDING FREEZE — odometry noise from the measured wheel odometry.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    do_beamskip: false
    set_initial_pose: false
