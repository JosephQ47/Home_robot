# Floor plan the planar simulator ray-casts against.
#
# A single-storey home of 6.6 x 7.6 m laid out as the five rooms the task
# configuration already names: 客厅 / 厨房 / 走廊 / 卧室 / 书房. Walls are given
# as lines with door gaps cut out of them, which is both easier to read and
# easier to keep consistent than a raw segment list.
#
# Units are metres in the map frame. The simulator's starting pose is the
# origin the saved map will be anchored to.
floorplan:
  # Outer shell.
  outer: {x_min: 0.0, y_min: 0.0, x_max: 6.6, y_max: 7.6}

  walls:
    # living / kitchen / corridor  ——  bedroom / study
    - {axis: y, at: 3.30, from: 0.0, to: 6.6, gaps: [[1.40, 2.20], [4.80, 5.60]]}
    # living  ——  kitchen + corridor
    - {axis: x, at: 3.80, from: 3.30, to: 7.6, gaps: [[5.00, 5.80]]}
    # kitchen  ——  corridor
    - {axis: y, at: 5.30, from: 3.80, to: 6.6, gaps: [[4.60, 5.40]]}
    # bedroom  ——  study
    - {axis: x, at: 3.20, from: 0.0, to: 3.30, gaps: [[1.20, 2.00]]}

  # A few pieces of furniture, so the map is not just empty boxes and the
  # costmap has something to inflate around.
  boxes:
    - {x_min: 0.40, y_min: 6.40, x_max: 1.90, y_max: 7.00}   # 客厅沙发
    - {x_min: 2.60, y_min: 4.20, x_max: 3.40, y_max: 5.00}   # 客厅茶几
    - {x_min: 4.20, y_min: 6.60, x_max: 6.40, y_max: 7.20}   # 厨房橱柜
    - {x_min: 0.40, y_min: 0.40, x_max: 2.10, y_max: 1.60}   # 卧室床
    - {x_min: 4.60, y_min: 0.40, x_max: 6.20, y_max: 1.10}   # 书房书桌

  # Where the robot starts, and where the saved map's origin lands.
  start: {x: 2.00, y: 5.20, yaw: 0.0}
