# hr_dock_pose_adapter node parameters.
#
# Only ros__parameters may appear in a file passed to --params-file: rcl rejects
# the whole file if any other top-level key carries a value. The dock database
# therefore lives in dock_database.yaml, which is read by the task layer rather
# than by the parameter parser.
#
# Charging dock: which tag marks it, and where the contacts sit relative to it.
#
# The tag is a tag36h11 printed at 100 mm edge length. At the Gemini 2's
# 1920x1080 colour resolution that spans roughly 120 px at 1 m, which is well
# above the detector's practical floor and still fits the frame at the 0.4 m
# pre-contact distance.
hr_dock_pose_adapter:
  ros__parameters:
    dock_id: home_dock
    tag_id: 7
    tag_family: tag36h11
    # apriltag_ros publishes each tag's 3D pose as a TF frame named like this.
    tag_frame_template: '{family}:{id}'

    # Pixel-level gates, applied before TF is consulted at all.
    # decision_margin below 30 is where tag36h11 false positives start appearing
    # on textured backgrounds; hamming 0 accepts only bit-perfect decodes.
    min_decision_margin: 30.0
    max_hamming: 0

    # [x, y, yaw] from the tag frame to the point base_link must reach for the
    # spring contacts to meet. The tag sits on the dock face, 0.32 m ahead of
    # where the robot stops, centred and square to it.
    tag_to_contact_xyyaw: [0.32, 0.0, 0.0]

    dock_frame_id: odom

    # Two Gemini 2 frames at 30 fps. A tag not seen for 500 ms is not there.
    tag_timeout_ms: 500

    # At 0.08 m/s docking speed the robot covers 2.7 mm between frames, so a
    # 0.15 m jump between consecutive detections is a misdetection, not motion.
    max_jump_xy_m: 0.15
    max_jump_yaw_rad: 0.35
    max_consecutive_jumps: 3

    # Three consecutive good frames (100 ms) before the first pose is published,
    # so one lucky decode cannot start an approach.
    min_consecutive_detections: 3
