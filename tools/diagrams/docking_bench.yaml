# Minimal opennav_docking configuration for capturing the real ROS graph:
# one SimpleChargingDock so the server can reach the active state and create its
# /cmd_vel_dock publisher. The project's own dock geometry lives in
# hr_docking/config/dock_database.yaml.
docking_server:
  ros__parameters:
    controller_frequency: 20.0
    dock_plugins: ['home_dock_plugin']
    home_dock_plugin:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.02
      staging_x_offset: -0.6
      use_battery_status: false
      use_external_detection_pose: true
      external_detection_timeout: 0.5
    docks: ['home_dock']
    home_dock:
      type: 'home_dock_plugin'
      frame: map
      pose: [0.0, 0.0, 0.0]
